# Bloque para el Nginx DEL SERVIDOR (no se aplica automáticamente).
# Se añade como archivo nuevo en sites-available; no reemplaza ningún bloque existente.
# El certificado debe emitirse con el mismo método que ya usa el servidor (ver docs/despliegue.md).
server {
    listen 80;
    listen [::]:80;
    server_name b4stin0n.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name b4stin0n.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/b4stin0n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b4stin0n.duckdns.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
