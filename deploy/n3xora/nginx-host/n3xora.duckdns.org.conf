# =============================================================================
# Nexora en n3xora.duckdns.org · sitio para un Nginx del host (CANDIDATO, no aplicado)
#
# Solo si el proxy TLS de Aatenea es Nginx (ver diagnostico-aatenea.sh). Es un archivo NUEVO en
# sites-available: el sitio de rrtf.duckdns.org no se toca. 127.0.0.1:8080 es el ejemplo del README:
# usa el HTTP_PORT verificado (el mismo destino que ya usa rrtf.duckdns.org).
# Certificado: primero se activa solo el bloque :80 (desafío ACME), se emite con
#   certbot certonly --webroot -w /var/www/letsencrypt -d n3xora.duckdns.org
# y después se activa el bloque :443. Pasos completos en docs/nexora-despliegue.md.
# =============================================================================

# HTTP: desafío ACME y redirección permanente a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name n3xora.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: termina TLS y reenvía al Nginx del contenedor frontend (que sirve la SPA y /api).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n3xora.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/n3xora.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n3xora.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:n3xora_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # HSTS prudente al principio (1 día); subir a 31536000 tras unos días sin incidencias.
    # Las demás cabeceras de seguridad las añade el Nginx del contenedor.
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sustituye (no añade) la cadena: el cliente no puede inyectar IPs falsas.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
