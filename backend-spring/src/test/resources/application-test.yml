# Perfil de tests: H2 en memoria en modo PostgreSQL (no requiere Docker ni BD externa).
# Para ejecutar contra PostgreSQL real, sobrescribe con variables de entorno:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/sgp_test \
#   SPRING_DATASOURCE_USERNAME=sgp SPRING_DATASOURCE_PASSWORD=sgp ./mvnw test
spring:
  datasource:
    url: jdbc:h2:mem:sgp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        # Permite contar sentencias SQL en los tests (detectar N+1).
        generate_statistics: true

logging:
  level:
    # Sin el resumen de métricas por sesión que acompaña a generate_statistics.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

app:
  jwt:
    # Clave exclusiva de tests (no usar en ningún otro entorno).
    secret: C3LPGb/hXLJuWguuQNdojKmT+oqHgYVu1ysc5uP5JDww2XPg6n4BThTiam3ZmzUT
    expiration: 1h
    issuer: nexora-test
  security:
    bcrypt-strength: 4
    cors:
      # Mismos valores que los de producción en application.yml (fijados aquí para que un
      # .env local no altere el resultado de los tests).
      allowed-origins: https://rrtf.duckdns.org,http://localhost:5173
    # Mismos valores que los predeterminados de application.yml (fijados aquí para que un entorno
    # local no altere los tests). Las pruebas del límite usan umbrales propios más bajos.
    limites:
      login:
        max-fallos: 10
        ventana: 15m
      registro:
        max-por-codigo: 20
        ventana-por-codigo: 1h
        max-global: 200
        ventana-global: 1h
      max-claves: 50000
  bootstrap:
    admin:
      username: ""
      email: ""
      password: ""
