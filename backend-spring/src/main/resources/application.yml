# =============================================================================
# Unisen SGP - Configuración base
# Todo valor sensible o dependiente del entorno se inyecta por variables de
# entorno (Docker / VPS). En local pueden definirse en un fichero `.env`.
# =============================================================================
spring:
  application:
    name: sgp-backend

  # Carga opcional de `.env` (formato CLAVE=valor) para desarrollo local.
  config:
    import: optional:file:.env[.properties]

  # --- PostgreSQL ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sgp}
    username: ${DB_USERNAME:sgp}
    password: ${DB_PASSWORD:sgp}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000 # ms

  jpa:
    # El esquema lo gestiona Flyway; Hibernate solo valida que coincide con las entidades.
    hibernate:
      ddl-auto: validate
    # Evita consultas perezosas fuera de la capa de servicio (antipatrón OSIV).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Asociaciones LAZY (p. ej. líneas de solicitud y sus productos) cargadas en lotes de
        # hasta 50 ids: evita N+1 en los listados sin paginar en memoria.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Límite defensivo: ?size=100000 no puede tumbar el servidor.
        max-page-size: 100
        # JSON estable: { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }
        serialization-mode: via-dto

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # 2.5 en un campo entero (p. ej. una cantidad) es un error (400), no un 2 silencioso.
      accept-float-as-int: false
    time-zone: UTC

  mvc:
    # Errores en formato RFC 9457 (application/problem+json).
    problemdetails:
      enabled: true

server:
  # 8081: puerto al que Nginx reenvía /api/ (contenedor backend).
  port: ${SERVER_PORT:8081}
  # Respeta X-Forwarded-* del proxy inverso (HTTPS en DuckDNS) al construir URLs.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

# --- Actuator: solo el healthcheck, para Docker / balanceadores ---
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# --- Swagger / OpenAPI (desactivar en producción con SWAGGER_ENABLED=false) ---
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

# =============================================================================
# Propiedades propias de la aplicación
# =============================================================================
app:
  jwt:
    # Clave HMAC en Base64 de al menos 256 bits. Obligatoria: sin ella la app no arranca.
    # Genera una con:  openssl rand -base64 64
    secret: ${JWT_SECRET:}
    # Duración del token (formatos: 30m, 1h, 8h...).
    expiration: ${JWT_EXPIRATION:1h}
    issuer: ${JWT_ISSUER:unisen-sgp}

  security:
    # Coste de BCrypt (4-31). 12 es un buen equilibrio para producción.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    cors:
      # Orígenes permitidos separados por comas: producción (DuckDNS) y Vite en desarrollo.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rrtf.duckdns.org,http://localhost:5173}

  # Alta del SUPER_ADMIN inicial al arrancar (solo si su username y su correo aún no existen).
  # Inicia sesión con ADMIN_USERNAME y aprovisiona las empresas con su gerente fundador
  # (POST /api/v1/empresas).
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:admin}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      nombre: ${ADMIN_NOMBRE:Administrador}
