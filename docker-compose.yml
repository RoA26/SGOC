# =============================================================================
# Unisen SGP - Orquestación completa (rrf.duckdns.org)
#
#   cp .env.example .env    # rellena las variables obligatorias
#   docker compose up -d --build
#
# Tráfico:  navegador → frontend (Nginx :80) ──/api/──→ spring-backend:8081 → postgres:5432
# Solo el frontend publica un puerto. PostgreSQL solo es accesible desde localhost del host.
# =============================================================================
name: sgp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgp}
      POSTGRES_USER: ${POSTGRES_USER:-sgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Solo en 127.0.0.1: útil para administrar o desarrollar, nunca expuesto a internet.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  spring-backend:
    build: ./backend-spring
    image: unisen/sgp-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sgp}
      DB_USERNAME: ${POSTGRES_USER:-sgp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -base64 64)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:-rrf.duckdns.org},http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      # Swagger no se publica a través de Nginx; se desactiva por defecto en producción.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    # Sin "ports": solo es alcanzable por Nginx a través de la red interna.
    expose:
      - "8081"
    networks:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: unisen/sgp-frontend:latest
    restart: unless-stopped
    depends_on:
      spring-backend:
        condition: service_healthy
    ports:
      # 80 por defecto. Cuando el TLS se termine en el host, usa p. ej. HTTP_PORT=127.0.0.1:8080.
      - "${HTTP_PORT:-80}:80"
    networks:
      - frontend

networks:
  # PostgreSQL solo comparte red con el backend; Nginx solo con el backend.
  backend:
  frontend:

volumes:
  postgres-data:
