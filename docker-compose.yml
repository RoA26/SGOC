# Infraestructura local de desarrollo: PostgreSQL 16.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: sgoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgoc
      POSTGRES_PASSWORD: sgoc
      POSTGRES_DB: sgoc
    ports:
      - "5432:5432"
    volumes:
      - sgoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgoc -d sgoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgoc-pgdata:
