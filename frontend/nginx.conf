# =============================================================================
# Unisen SGP - Nginx del contenedor frontend (rrtf.duckdns.org)
#
#   /       → estáticos de React (SPA)
#   /api/   → contenedor backend:8081
#
# Escucha en HTTP (80). El TLS se termina en el host (proxy inverso + certificado)
# y llega aquí como HTTP con X-Forwarded-Proto: https.
# =============================================================================

# DNS interno de Docker. Resolver en cada petición (con caché de 10 s) evita que Nginx
# falle al arrancar si el backend aún no existe, o siga usando una IP antigua tras
# recrear su contenedor.
resolver 127.0.0.11 valid=10s ipv6=off;

# Conserva el esquema original si ya viene de un proxy TLS en el host.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name rrtf.duckdns.org localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # Cabeceras de seguridad (ninguna location usa add_header, así que todas las heredan).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    # --- API → Spring Boot -------------------------------------------------
    location /api/ {
        set $backend http://backend:8081;
        # Sin URI tras el host: la ruta llega intacta (/api/auth/login).
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Si el backend no está disponible, error JSON en el mismo formato que la API.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Servicio no disponible","status":503,"detail":"El servidor no está disponible en este momento. Inténtalo de nuevo en unos minutos."}';
    }

    # --- Healthcheck del contenedor --------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Estáticos con hash en el nombre: caché de larga duración -------------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA: cualquier otra ruta sirve index.html (React Router) -----------
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
