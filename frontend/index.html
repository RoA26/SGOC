<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexora-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nexora · Órdenes de Compra</title>
    <script>
      // Tema elegido con el alternador (src/lib/tema.ts), aplicado antes de pintar para no parpadear.
      try {
        var tema = localStorage.getItem('nexora-tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
